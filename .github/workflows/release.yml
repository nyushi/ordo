name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to ref)"
        required: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
      discussions: read
      issues: read
      metadata: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      ARCHIVE_NAME: Ordo-macos.zip
      TAP_REPO: nyushi/homebrew-tap
      FORMULA_PATH: Formula/ordo.rb
    steps:
      - name: Resolve release tag
        id: resolve-tag
        run: |
            tag=""
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              tag="${{ github.ref_name }}"
            elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
              tag="${{ github.event.inputs.tag }}"
            fi
            if [[ -z "$tag" ]]; then
              echo "::error::No release tag provided. Push a tag or supply the 'tag' input."
              exit 1
            fi
            echo "TAG_NAME=$tag" >> "$GITHUB_ENV"
            echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.value }}

      - name: Build release binary
        run: swift build -c release

      - name: Capture build output path
        id: build-info
        run: echo "bin_path=$(swift build -c release --show-bin-path)" >> "$GITHUB_OUTPUT"

      - name: Package binary
        run: |
          BIN_PATH="${{ steps.build-info.outputs.bin_path }}"
          mkdir -p dist
          cp "$BIN_PATH/Ordo" dist/Ordo
          strip -x dist/Ordo || true
          cd dist
          zip -r "../${ARCHIVE_NAME}" Ordo

      - name: Compute checksum
        id: checksum
        run: |
          SHA=$(shasum -a 256 "${ARCHIVE_NAME}" | cut -d ' ' -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ env.TAG_NAME }}
          files: ${{ env.ARCHIVE_NAME }}

      - name: Update Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
          SHA256: ${{ steps.checksum.outputs.sha }}
        run: |
          VERSION="${TAG_NAME#v}"
          .github/scripts/update-homebrew-formula.sh \
            "${TAP_REPO}" \
            "${FORMULA_PATH}" \
            "${TAG_NAME}" \
            "${VERSION}" \
            "${SHA256}"
